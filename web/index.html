<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRYPT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="crt">
  <section class="pane game" aria-label="Game">
    <h1>CRYPT</h1>
    <div id="transcript" class="transcript" role="log" aria-live="polite"></div>
    <form id="input-form" class="input-row" autocomplete="off">
      <label for="cmd" class="prompt">&gt;</label>
      <input id="cmd" type="text" spellcheck="false" autocapitalize="off" autofocus disabled>
    </form>
  </section>
  <aside class="pane events" aria-label="Event log">
    <h2>Event log</h2>
    <ol id="event-log" class="event-log"></ol>
    <p id="event-empty" class="muted">No markers detected yet.</p>
  </aside>
</main>
<script src="vendor/zvm.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
