name: CRYPT
description: Turn the checked-out repository's dependency risk into a creature. Report only by default, never merges.
author: e-1305
branding:
  icon: shield
  color: green
inputs:
  mode:
    description: "report (default, read only, no token needed) or graft (DEMO ONLY: opens a pull request on e-1305/crypt-demo, needs token, a human merges)"
    required: false
    default: report
  path:
    description: Directory of the checked-out repository to scan, relative to the workspace.
    required: false
    default: .
  token:
    description: Fine-grained token for the demo repository, mode graft only. Ignored in report mode.
    required: false
    default: ""
  limb:
    description: Demo only. Limb to graft (LODASH or JQUERY). Used by mode graft only.
    required: false
    default: LODASH
  sabotage:
    description: Demo only, with graft. Adds a failing test so CI goes red.
    required: false
    default: "false"
  alerts:
    description: "none (default) or issues: report mode prints the GitHub issues crypt alerts --format issues would open, one per KEV limb (dry-run, no token)."
    required: false
    default: none
  upload-sarif:
    description: "true or false (default). With true, report mode writes SARIF 2.1.0 (crypt alerts --format sarif) and uploads it to GitHub Code Scanning. The job needs permissions: security-events: write."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install CRYPT
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund
    - name: Run CRYPT
      id: crypt
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_LIMB: ${{ inputs.limb }}
        INPUT_SABOTAGE: ${{ inputs.sabotage }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_ALERTS: ${{ inputs.alerts }}
        INPUT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
      run: |
        ws="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
        target="$(cd "$ws/$INPUT_PATH" 2>/dev/null && pwd -P)" || { echo "::error::path '$INPUT_PATH' not found in the workspace"; exit 2; }
        case "$target/" in "$ws/"*) ;; *) echo "::error::path must stay inside the workspace"; exit 2 ;; esac
        export CRYPT_TARGET="$target"
        if [ "$INPUT_MODE" = "graft" ] && [ -n "$INPUT_TOKEN" ]; then
          echo "::add-mask::$INPUT_TOKEN"
          export GITHUB_TOKEN="$INPUT_TOKEN"
        fi
        bash "${{ github.action_path }}/scripts/ci/action.sh" "$INPUT_MODE" "$INPUT_LIMB" "$INPUT_SABOTAGE"
    - name: Upload SARIF to Code Scanning
      if: inputs.upload-sarif == 'true' && steps.crypt.outputs.sarif != '' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.crypt.outputs.sarif }}
        category: crypt
    - name: Upload creature.json and the autopsy
      if: always() && steps.crypt.outputs.dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: crypt-creature-${{ github.job }}-${{ strategy.job-index }}-${{ github.action }}
        path: |
          ${{ steps.crypt.outputs.dir }}/creature.json
          ${{ steps.crypt.outputs.dir }}/autopsy.html
        if-no-files-found: warn
