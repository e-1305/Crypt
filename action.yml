name: CRYPT
description: Turn the checked-out repository's dependency risk into a creature. Report only by default, never merges.
author: e-1305
branding:
  icon: shield
  color: green
inputs:
  mode:
    description: "report (default, read only, no token needed) or graft (opens a pull request, needs token, a human merges)"
    required: false
    default: report
  path:
    description: Directory of the checked-out repository to scan, relative to the workspace.
    required: false
    default: .
  token:
    description: Fine-grained token for mode graft only. Ignored in report mode.
    required: false
    default: ""
  limb:
    description: Limb to graft (LODASH or JQUERY). Used by mode graft only.
    required: false
    default: LODASH
  sabotage:
    description: Demo only, with graft. Adds a failing test so CI goes red.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install CRYPT
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund
    - name: Run CRYPT
      id: crypt
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_LIMB: ${{ inputs.limb }}
        INPUT_SABOTAGE: ${{ inputs.sabotage }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_PATH: ${{ inputs.path }}
      run: |
        export CRYPT_TARGET="${GITHUB_WORKSPACE}/${INPUT_PATH}"
        if [ "$INPUT_MODE" = "graft" ] && [ -n "$INPUT_TOKEN" ]; then
          echo "::add-mask::$INPUT_TOKEN"
          export GITHUB_TOKEN="$INPUT_TOKEN"
        fi
        bash "${{ github.action_path }}/scripts/ci/action.sh" "$INPUT_MODE" "$INPUT_LIMB" "$INPUT_SABOTAGE"
    - name: Upload creature.json and the autopsy
      if: always() && steps.crypt.outputs.dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: crypt-creature
        path: |
          ${{ steps.crypt.outputs.dir }}/creature.json
          ${{ steps.crypt.outputs.dir }}/autopsy.html
        if-no-files-found: warn
