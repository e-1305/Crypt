name: live-raid

# Run the live raid from a phone: GitHub app, Crypt, Actions, live-raid, Run workflow.
# The token is the fine-grained CRYPT_DEMO_TOKEN (only e-1305/crypt-demo). This workflow never writes
# to this repository, and nothing here merges: a person lands the pull request on crypt-demo.
on:
  workflow_dispatch:
    inputs:
      limb:
        description: Limb to work on
        type: choice
        options:
          - LODASH
          - JQUERY
        default: LODASH
      mode:
        description: What to do
        type: choice
        options:
          - graft
          - inquisit
          - reraise
        default: graft
      sabotage:
        description: Demo only, with graft. Adds a failing test so CI goes red.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-raid
  cancel-in-progress: false

env:
  CRYPT_TOOLCHAIN_DIR: ${{ github.workspace }}/.toolchain

jobs:
  live-raid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/setup-tools.sh') }}
      - run: npm run setup
      # Run state (out/ and the audit log) lets inquisit and reraise find the pull request that graft opened.
      - name: Restore run state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            out
            crypt-audit.log
          key: live-raid-state-${{ github.run_id }}
          restore-keys: live-raid-state-
      - name: Live raid
        env:
          # The only step that sees the token. crypt reads it as GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.CRYPT_DEMO_TOKEN }}
          MODE: ${{ inputs.mode }}
          LIMB: ${{ inputs.limb }}
          SABOTAGE: ${{ inputs.sabotage }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "CRYPT_DEMO_TOKEN is not set. Add it under Settings, Secrets and variables, Actions." >&2
            exit 1
          fi
          echo "::add-mask::$GITHUB_TOKEN"
          bash scripts/ci/live-raid.sh "$MODE" "$LIMB" "$SABOTAGE"
      - name: Save run state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out
            crypt-audit.log
          key: live-raid-state-${{ github.run_id }}
      - name: Upload the plate and the creature
        if: inputs.mode == 'reraise'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-raid-reraise
          path: |
            out/plate.txt
            out/creature.json
            out/creature.z8
          if-no-files-found: warn
