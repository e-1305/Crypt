name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CRYPT_TOOLCHAIN_DIR: ${{ github.workspace }}/.toolchain

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/setup-tools.sh') }}
      - name: Build toolchain
        run: bash scripts/setup-tools.sh
      # Spike builds the story that the integration tests play, so it runs before vitest.
      - run: npm run spike
      - name: Exhume and raise the fixture creature
        run: |
          npm run exhume -- fixtures/vulnerable-npm --feeds fixtures/vulnerable-npm/feeds --offline
          npm run raise -- out/creature.json
      - run: npm run raise:check
      - run: npm run necromancer:check
      - name: Unit and property tests (1000 runs)
        run: npx vitest run
        env:
          CRYPT_NUM_RUNS: "1000"
      - name: Offline raid
        run: bash scripts/ci/raid-offline.sh

  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/setup-tools.sh') }}
      - run: npm run build:site
      - run: npx playwright-core install --with-deps chromium
      - name: Screenshots and layout checks at 390x844, 1280x800, 1440x900, 1920x1080
        run: npm run test:visual
      - name: Lighthouse accessibility on the 2D page (>= 95)
        run: npm run test:a11y
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa
          path: out/visual-qa
          if-no-files-found: ignore

  failsafe-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/failsafe-guard.sh

  kiro-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history so commit SHAs and PR numbers in docs/KIRO.md resolve.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Counts for docs/KIRO.md (tests are counted by the test job)
        run: npm run kiro:stats -- --no-tests
      - name: Links, repository paths and commit SHAs in docs/KIRO.md
        run: npm run kiro:stats -- --check-links
      - name: Every hook has a command action that writes docs/evidence/hook-runs.jsonl
        run: node scripts/ci/hook-evidence-check.mjs
      - name: Stats blocks in docs/DEVPOST.md and docs/BLOG.md are current
        run: npm run kiro:stats -- --check-docs

  pack-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/setup-tools.sh') }}
      - name: Build toolchain
        run: bash scripts/setup-tools.sh
      - name: Pack, install into an empty project, run the installed CLI
        run: bash scripts/ci/pack-install-test.sh
        env:
          CRYPT_PACK_RAID: "1"
