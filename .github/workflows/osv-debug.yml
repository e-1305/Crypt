name: osv-debug
on: workflow_dispatch
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: |
          node -e '
          (async()=>{
            const r=await fetch("https://api.osv.dev/v1/querybatch",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({queries:[{package:{ecosystem:"npm",name:"lodash"},version:"4.17.15"},{package:{ecosystem:"npm",name:"jquery"},version:"3.4.1"}]})});
            console.log("batch",r.status); const j=await r.json(); console.log(JSON.stringify(j).slice(0,600));
            const id=j.results[0].vulns[0].id; const d=await fetch("https://api.osv.dev/v1/vulns/"+id); console.log("detail",d.status);
          })().catch(e=>{console.log("ERR",e)})'
      - run: node bin/crypt.mjs exhume https://github.com/e-1305/crypt-demo
