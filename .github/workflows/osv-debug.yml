name: osv-debug
on: workflow_dispatch
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run setup
      - run: npm run --silent feeds:update && node bin/crypt.mjs exhume https://github.com/e-1305/crypt-demo && node bin/crypt.mjs raise out/creature.json && cat out/limbs.json
