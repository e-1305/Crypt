name: stats

# Regenerates the stats blocks and the timeline on main only (issue #112).
# PRs never run kiro:stats --write or kiro:timeline.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stats-on-main
  cancel-in-progress: false

jobs:
  regenerate:
    # Loop guard: skip pushes whose head commit is a stats commit. Manual runs always run.
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(stats): regenerate') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run kiro:stats -- --write
      - run: npm run kiro:timeline
      - name: Commit and push when anything changed
        run: |
          if git diff --quiet; then
            echo "Nothing to regenerate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore(stats): regenerate [skip ci]"
          git push origin HEAD:main
