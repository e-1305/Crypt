name: action-selftest

# Runs this repository's own action in report mode against e-1305/crypt-demo.
# Top level stays read only. Only the selftest job also gets security-events: write, to upload SARIF to Code Scanning.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: e-1305/crypt-demo
          path: target
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: crypt
      - uses: ./crypt
        with:
          mode: report
          path: target
      - name: Self-test with SARIF upload to Code Scanning
        uses: ./crypt
        with:
          mode: report
          path: target
          upload-sarif: "true"
